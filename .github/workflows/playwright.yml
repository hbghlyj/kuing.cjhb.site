name: Playwright Functional Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, curl, xml, json, gd, imap
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Dependencies
        run: |
          composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
          npm install playwright

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Configure Database & DiscuzX
        run: |
          echo -e "[client]\nhost=127.0.0.1\nuser=root\npassword=" > ~/.my.cnf
          sudo cp ~/.my.cnf /root/.my.cnf
          sudo chmod 600 ~/.my.cnf /root/.my.cnf

          mysql -e "CREATE DATABASE ultrax;"
          mysql -e "CREATE USER IF NOT EXISTS 'discuz'@'%' IDENTIFIED BY 'password';"
          mysql -e "GRANT ALL PRIVILEGES ON ultrax.* TO 'discuz'@'%';"
          mysql -e "FLUSH PRIVILEGES;"

          sed '1d' install/sql/sql_install.php | mysql ultrax

          cp config/config_global_default.php config/config_global.php
          sed -i "s/\$_config\['db'\]\[1\]\['dbname'\]  		= 'mitframe';/\$_config['db'][1]['dbname'] = 'ultrax';/g" config/config_global.php
          sed -i "s/\$_config\['db'\]\[1\]\['dbuser'\]  		= 'root';/\$_config['db'][1]['dbuser'] = 'discuz';/g" config/config_global.php
          sed -i "s/\$_config\['db'\]\[1\]\['dbpw'\] 	 	= '';/\$_config['db'][1]['dbpw'] = 'password';/g" config/config_global.php
          sed -i "s/\$_config\['db'\]\[1\]\['dbhost'\]  		= 'localhost';/\$_config['db'][1]['dbhost'] = '127.0.0.1';/g" config/config_global.php

          mkdir -m 777 -p data/template/EN data/template/TC data/sysdata data/cache data/log data/diy data/avatar data/plugindata data/download data/addonmd5 data/threadcache data/attachment
          chmod -R 777 data config

          cp chat/php/config_default.php chat/php/config.php
          echo '<?php if (!class_exists("Pusher")) {     class Pusher {         public function __construct(...$args) {}         public function trigger($channel, $event, $data, $a = null, $b = null)         {             return true;         }     } } ?>'  > source/class/class_pusher.php
          DISCUZ_SEED_DATABASE=1 php .github/scripts/import_all_data.php
          php -d zend.assertions=1 -d assert.exception=1 .github/scripts/test_emailpost.php

          test "$(mysql ultrax -Nse "SHOW TABLES LIKE 'chat';")" = "chat"
          mysql ultrax -e "REPLACE INTO pre_common_setting SET skey='homestatus', svalue='1';"
          php -r 'require "./source/class/class_core.php"; $discuz = C::app(); $discuz->init(); require_once libfile("function/cache"); updatecache("setting");'
          php .agents/tools/rebuild_styles.php --host=127.0.0.1:8080
          DISCUZ_STRICT_LANG=1 php .github/scripts/setup_test_security.php --url=http://127.0.0.1:8080
          test -s data/cache/style_2_common.css
      - name: Start PHP Server
        run: |
          DISCUZ_STRICT_LANG=1 php -S 127.0.0.1:8080 > php_server.log 2>&1 &
          echo $! > php_server.pid
          sleep 1
          curl --fail --silent --show-error 'http://127.0.0.1:8080/data/cache/style_2_common.css' > /dev/null

      - name: Run Playwright Tests
        env:
          TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Phase 1: Independent suites run in parallel.
          node .github/scripts/test_forum.js &
          P1=$!
          node .github/scripts/test_forum_mobile.js &
          P2=$!
          node .github/scripts/test_admin.js &
          P3=$!

          FAIL=0
          wait $P1 || FAIL=1
          wait $P2 || FAIL=1
          wait $P3 || FAIL=1

          if [ $FAIL -ne 0 ]; then
            echo "Phase 1 test suites failed."
            exit 1
          fi

          # Phase 2: Suites that search or inspect forum.js output
          node .github/scripts/test_search.js &
          P4=$!
          node .github/scripts/test_tags.js &
          P5=$!

          wait $P4 || FAIL=1
          wait $P5 || FAIL=1

          if [ $FAIL -ne 0 ]; then
            echo "Phase 2 test suites failed."
            exit 1
          fi

      - name: Check PHP Server Errors
        if: always()
        run: |
          # The functional test suite deliberately verifies that an upload request without formhash is rejected with 403 Forbidden.
          if grep -vE '\[403\]: POST /misc\.php\?mod=upload' php_server.log | grep -E '\[(4|5)[0-9]{2}\]:'; then
            echo "Found unexpected HTTP 4xx or 5xx errors in php_server.log:"
            grep -vE '\[403\]: POST /misc\.php\?mod=upload' php_server.log | grep -E '\[(4|5)[0-9]{2}\]:'
            exit 1
          else
            echo "No unexpected HTTP 4xx or 5xx errors found."
          fi

      - name: Upload Screenshots and Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            functional_test_report.md
            browser_error.txt
            *.png
            *.html
            data/log/
          retention-days: 7
