<div class="dz-sky-banner" role="img" aria-label="A bright blue morning sky with soft white clouds">
  <svg viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="dz-sky-gradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#69CDFF"/>
        <stop offset=".34" stop-color="#9BDDFF"/>
        <stop offset=".68" stop-color="#DDF3FF"/>
        <stop offset=".9" stop-color="#F8FDFF"/>
        <stop offset="1" stop-color="#FFFFFF"/>
      </linearGradient>
      <radialGradient id="dz-sky-halo" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity=".98"/>
        <stop offset=".2" stop-color="#FFFDF0" stop-opacity=".78"/>
        <stop offset=".55" stop-color="#EFFFFF" stop-opacity=".2"/>
        <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="dz-cloud-shade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity=".98"/>
        <stop offset=".5" stop-color="#F7FCFF" stop-opacity=".9"/>
        <stop offset="1" stop-color="#CBE9F7" stop-opacity=".18"/>
      </linearGradient>
      <filter id="dz-cloud-organic" x="-18%" y="-30%" width="136%" height="170%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency=".006 .021" numOctaves="4" seed="23" stitchTiles="stitch" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="28" xChannelSelector="R" yChannelSelector="B" result="cloud"/>
        <feGaussianBlur in="cloud" stdDeviation="2.2"/>
      </filter>
      <linearGradient id="dz-cloud-fade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff"/>
        <stop offset=".68" stop-color="#fff"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="dz-sky-bottom-fade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".68" stop-color="#fff" stop-opacity=".72"/>
        <stop offset="1" stop-color="#fff"/>
      </linearGradient>
      <mask id="dz-cloud-mask" maskUnits="userSpaceOnUse" x="0" y="120" width="1600" height="400">
        <rect x="0" y="120" width="1600" height="400" fill="url(#dz-cloud-fade)"/>
      </mask>
      <filter id="dz-sky-glow" x="-250%" y="-250%" width="600%" height="600%">
        <feGaussianBlur stdDeviation="7" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="dz-wispy-organic" x="-32%" y="-70%" width="168%" height="245%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency=".009 .04" numOctaves="3" seed="11" stitchTiles="stitch" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="38" xChannelSelector="R" yChannelSelector="G" result="wisp"/>
        <feGaussianBlur in="wisp" stdDeviation="5"/>
      </filter>
    </defs>
    <rect width="1600" height="520" fill="url(#dz-sky-gradient)"/>
    <g aria-hidden="true">
      <ellipse cx="250" cy="65" rx="430" ry="330" fill="url(#dz-sky-halo)" opacity=".96"/>
      <ellipse cx="178" cy="38" rx="176" ry="144" fill="url(#dz-sky-halo)" opacity=".78" filter="url(#dz-sky-glow)"/>
      <path d="M95 -10L338 -10L772 430L520 430Z" fill="#fff" opacity=".16"/>
      <path d="M-40 34L40 -30L565 373L438 430Z" fill="#fff" opacity=".08"/>
      <circle cx="171" cy="59" r="13" fill="#fff" opacity=".48" filter="url(#dz-sky-glow)"/>
    </g>
    <g filter="url(#dz-wispy-organic)" opacity=".42" aria-hidden="true">
      <path d="M505 294C660 235 815 279 950 244C1085 208 1190 190 1390 236C1240 245 1110 286 930 302C760 318 636 317 505 294Z" fill="#fff" opacity=".58"/>
      <path d="M154 360C305 305 423 326 545 306C680 284 766 273 879 297C725 315 612 347 484 363C351 378 248 374 154 360Z" fill="#fff" opacity=".42"/>
    </g>
    <g mask="url(#dz-cloud-mask)" filter="url(#dz-cloud-organic)">
      <path d="M-70 455C-10 392 70 382 130 402C155 347 215 320 275 343C310 284 390 263 450 305C495 260 580 266 615 329C675 310 735 342 750 397C815 404 850 440 860 490V550H-70Z" fill="url(#dz-cloud-shade)" opacity=".84"/>
      <path d="M735 465C780 408 838 390 900 404C925 340 992 304 1058 330C1095 245 1208 215 1285 282C1360 228 1485 250 1512 344C1580 338 1635 378 1660 432V552H735Z" fill="url(#dz-cloud-shade)"/>
      <ellipse cx="338" cy="354" rx="182" ry="85" fill="#fff" opacity=".62"/>
      <ellipse cx="1155" cy="330" rx="176" ry="104" fill="#fff" opacity=".7"/>
      <ellipse cx="1365" cy="337" rx="192" ry="100" fill="#fff" opacity=".78"/>
    </g>
    <rect y="410" width="1600" height="110" fill="url(#dz-sky-bottom-fade)"/>
    <rect y="510" width="1600" height="10" fill="#fff"/>
  </svg>
</div>
