<div class="forum-stats-scroll">
	<table class="forum-stats-table" aria-label="{lang stats}">
		<thead>
			<tr>
				<th scope="col">{lang index_today}</th>
				<th scope="col">{lang index_yesterday}</th>
				<th scope="col">{lang index_members_today}</th>
				<!--{if $_G['cache']['userstats']['newsetuser']}--><th scope="col">{lang welcome_new_members}</th><!--{/if}-->
			</tr>
		</thead>
		<tbody>
			<tr>
				<td><a href="search.php?mod=forum&srchfrom={echo strtotime('today')}&searchsubmit=yes">$todayposts</a></td>
				<td><a href="search.php?mod=forum&srchfrom={echo strtotime('yesterday')}&before={echo strtotime('today')}&searchsubmit=yes">$postdata[0]</a></td>
				<td>$onlineinfo[0]</td>
				<!--{if $_G['cache']['userstats']['newsetuser']}--><td><a href="home.php?mod=space&username={echo rawurlencode($_G['cache']['userstats']['newsetuser'])}" target="_blank" class="xi2">$_G['cache']['userstats']['newsetuser']</a></td><!--{/if}-->
			</tr>
		</tbody>
	</table>
</div>
