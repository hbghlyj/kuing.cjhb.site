<!--{template common/header}-->
<!--{if ($op == 'set')}-->
<!--{elseif ($op == 'manage')}-->
	<h3 class="flb">
		<em>{lang post_tag}</em>
	</h3>
	<div class="c">
		<input type="hidden" name="tid" id="tid" value="$_GET[tid]" />
		<!--{template forum/tag_input}-->
		<!--{if $recent_use_tag}-->
		<p class="mtn" style="width:300px">{lang recent_use_tag}
			<!--{eval $tagi = 0;}-->
			<!--{loop $recent_use_tag $var}-->
				<!--{if $tagi}-->, <!--{/if}--><a class="xi2" onclick="addKeyword('$var')">$var</a>
				<!--{eval $tagi++;}-->
			<!--{/loop}-->
		</p>
		<!--{/if}-->
	</div>
	<p class="o pns">
		<button type="button" name="search_button" class="pn" value="false" onclick="tagset();"><strong>{lang submit}</strong></button>
		<button type="button" id="closebtn" class="pn" onclick="hideWindow('$_GET[handlekey]');"><strong>{lang close}</strong></button>
	</p>
<!--{/if}-->
	<script type="text/javascript">
	function tagset() {
		var tags = $('tags').value;
		var tid = $('tid').value;
		tags = BROWSER.ie && document.charset == 'utf-8' ? encodeURIComponent(tags) : tags;
		var url = 'forum.php?mod=misc&action=retag&inajax=1&tags='+encodeURIComponent(tags)+'&tid='+tid+'&formhash={FORMHASH}';
		var x = new Ajax();
		x.getJSON(url, function(s){
			if(s && s.status == 'success') {
				updateThreadTags(s.tags);
				updateRelatedThreads(s.related);
				updateModact(s.modact);
				hideWindow('$_GET[handlekey]');
			}
		});
	}
	function updateThreadTags(tags) {
		var el = $('threadtags');
		if(!el) {
			return;
		}
		el.innerHTML = '';
		if(tags && tags.length) {
			var links = [];
			for(var i = 0; i < tags.length; i++) {
				var a = document.createElement('a');
				a.title = tags[i].name;
				a.href = 'misc.php?mod=tag&id=' + encodeURIComponent(tags[i].id) + '&name=' + encodeURIComponent(tags[i].name);
				a.target = '_blank';
				a.textContent = tags[i].name;
				links.push(a);
			}
			for(var j = 0; j < links.length; j++) {
				if(j) {
					el.appendChild(document.createTextNode(', '));
				}
				el.appendChild(links[j]);
			}
		}
	}
	function updateRelatedThreads(html) {
		var list = document.querySelector('.relatedthreadlist');
		var wrapper = list ? list.closest('.mtw.mbw') : null;
		if(html) {
			var holder = document.createElement('div');
			holder.innerHTML = html;
			var newWrapper = holder.firstElementChild;
			if(newWrapper) {
				if(wrapper) {
					if(typeof MathJax !== 'undefined' && MathJax.typesetClear) {
						MathJax.typesetClear([wrapper]);
					}
					wrapper.replaceWith(newWrapper);
				} else {
					var plc = document.querySelector('.plc.plm');
					if(plc) {
						plc.appendChild(newWrapper);
					}
				}
				if(typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
					MathJax.typesetPromise([newWrapper]).catch(function() {});
				}
			}
		} else if(wrapper) {
			if(typeof MathJax !== 'undefined' && MathJax.typesetClear) {
				MathJax.typesetClear([wrapper]);
			}
			wrapper.remove();
		}
	}
	function updateModact(html) {
		var existing = document.querySelector('.modact');
		if(html) {
			var holder = document.createElement('div');
			holder.innerHTML = html;
			var newBar = holder.firstElementChild;
			if(!newBar) {
				return;
			}
			if(existing) {
				existing.replaceWith(newBar);
			} else {
				var ptg = document.querySelector('.ptg');
				if(ptg) {
					ptg.insertAdjacentElement('afterend', newBar);
				}
			}
		} else if(existing) {
			existing.remove();
		}
	}
	</script>
<!--{template common/footer}-->
