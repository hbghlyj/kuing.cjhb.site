<div class="revision-window tex2jax_ignore">
	<div class="revision-toolbar">
		<label for="revision_select">{lang post_revision_history}</label>
		<select id="revision_select" onchange="renderRevisionDiff(this.value)">
			<!--{loop $versions $revision_index $revision}-->
			<option value="$revision_index">$revision['label']</option>
			<!--{/loop}-->
		</select>
		<form method="post" action="forum.php?mod=misc&action=editlog&tid=$revision_tid&pid=$pid" onsubmit="return confirm('{lang post_revision_restore_confirm}');">
			<input type="hidden" name="formhash" value="{FORMHASH}">
			<input type="hidden" name="do" value="rollback">
			<input type="hidden" name="editid" id="revision_editid" value="0">
			<button type="submit" id="revision_restore" disabled="disabled">{lang post_revision_restore}</button>
		</form>
		<button type="button" class="revision-close" onclick="if(typeof hideWindow == 'function'){hideWindow('editlog')}else if(typeof popup != 'undefined'){popup.close()}">{lang close}</button>
	</div>
	<div class="revision-diff-label">{lang post_revision_compare}</div>
	<div id="revision_diff" class="revision-diff"></div>
</div>
<style>
#fwin_editlog:has(.revision-window) .fwin { width: min(calc(100vw - 24px), 860px); }
.revision-window { width: 100%; padding: 16px; box-sizing: border-box; background: #fff; }
.revision-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.revision-toolbar label { font-weight: 700; }
.revision-toolbar select { flex: 1; min-width: 220px; max-width: 520px; }
#revision_select { appearance: auto; -webkit-appearance: auto; -moz-appearance: auto; background: var(--dz-BG-0); color: var(--dz-FC-333); }
.revision-toolbar form { margin: 0 0 0 auto; }
.revision-toolbar button { padding: 4px 10px; }
.revision-close { margin-left: 8px; border: 1px solid #ddd; background: #fff; color: #666; cursor: pointer; border-radius: 3px; }
.revision-close:hover { background: #f2f2f2; color: #333; }
.revision-diff-label { margin-bottom: 5px; color: #888; }
.revision-diff { max-height: 55vh; overflow: auto; border: 1px solid #ddd; background: #fafafa; font: 13px/1.5 monospace; }
.revision-diff div { position: relative; padding: 1px 8px 1px 2.2em; white-space: pre-wrap; overflow-wrap: anywhere; }
.revision-diff div::before { position: absolute; left: 0; top: 0; bottom: 0; width: 2em; text-align: right; padding-right: 0.5em; user-select: none; }
.revision-diff .same::before { content: '\00a0'; }
.revision-diff .removed::before { content: '-'; }
.revision-diff .added::before { content: '+'; }
.revision-diff .same { color: #555; }
.revision-diff .removed { background: #ffe8e8; color: #900; }
.revision-diff .added { background: #e8f7e8; color: #075b07; }
.revision-diff .removed .removed-inline { background: #f4c2c2; }
.revision-diff .added .added-inline { background: #b7e5b7; }
</style>
<script type="text/javascript" reload="1">
(function() {
	var revisions = {echo $versions_json};
	function escapeHtml(value) {
		return String(value == null ? '' : value).replace(/[&<>"']/g, function(char) {
			return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char];
		});
	}
	function decodeEntities(value) {
		return String(value == null ? '' : value).replace(/&(?:amp|lt|gt|quot|apos|#39|#x39);|&#(\d+);|&#x([0-9a-fA-F]+);/g, function(match, dec, hex) {
			if(dec) return String.fromCharCode(parseInt(dec, 10));
			if(hex) return String.fromCharCode(parseInt(hex, 16));
			return {'&amp;':'&','&lt;':'<','&gt;':'>','&quot;':'"','&apos;':"'",'&#39;':"'",'&#x39;':"'"}[match];
		});
	}
	function textOf(revision) {
		var body = revision.message || '';
		if(!body && revision.content) {
			body = revision.content;
			try {
				var outer = typeof body === 'string' ? JSON.parse(body) : body;
				var inner = outer && outer.content ? (typeof outer.content === 'string' ? JSON.parse(outer.content) : outer.content) : outer;
				if(inner && Array.isArray(inner.blocks)) {
					body = inner.blocks.map(function(block) {
						return block && block.data && (block.data.text || block.data.items) || '';
					}).join('\n');
				}
			} catch(error) {}
		}
		return decodeEntities((revision.subject ? revision.subject + '\n\n' : '') + body);
	}
	function charSegments(oldText, newText) {
		var oldChars = oldText.split('');
		var newChars = newText.split('');
		var lcs = [];
		for(var i = 0; i <= oldChars.length; i++) lcs[i] = [];
		for(var i = oldChars.length - 1; i >= 0; i--) {
			for(var j = newChars.length - 1; j >= 0; j--) {
				lcs[i][j] = oldChars[i] === newChars[j] ? (lcs[i + 1][j + 1] || 0) + 1 : Math.max(lcs[i + 1][j] || 0, lcs[i][j + 1] || 0);
			}
		}
		var oldSegments = [];
		var newSegments = [];
		var oldRun = '';
		var newRun = '';
		var i = 0;
		var j = 0;
		while(i < oldChars.length || j < newChars.length) {
			if(i < oldChars.length && j < newChars.length && oldChars[i] === newChars[j]) {
				if(oldRun) { oldSegments.push([oldRun, true]); oldRun = ''; }
				if(newRun) { newSegments.push([newRun, true]); newRun = ''; }
				oldSegments.push([oldChars[i], false]);
				newSegments.push([newChars[j], false]);
				i++;
				j++;
			} else if(j < newChars.length && (i >= oldChars.length || (lcs[i][j + 1] || 0) > (lcs[i + 1][j] || 0))) {
				newRun += newChars[j];
				j++;
			} else if(i < oldChars.length) {
				oldRun += oldChars[i];
				i++;
			}
		}
		if(oldRun) oldSegments.push([oldRun, true]);
		if(newRun) newSegments.push([newRun, true]);
		return {old: oldSegments, new: newSegments};
	}
	function tokenize(text) {
		return text.match(/\w+|\s+|[^\w\s]+/g) || [];
	}
	function refinable(text) {
		return text.length <= 100 && !/^\s+$/.test(text) && (/\w/.test(text) || /[\u4e00-\u9fff]/.test(text));
	}
	function diffSegments(oldText, newText) {
		if(oldText === newText) {
			return {old: [[oldText, false]], new: [[newText, false]]};
		}
		var oldTokens = tokenize(oldText);
		var newTokens = tokenize(newText);
		if(!oldTokens.length) return {old: [], new: [[newText, true]]};
		if(!newTokens.length) return {old: [[oldText, true]], new: []};
		var lcs = [];
		for(var i = 0; i <= oldTokens.length; i++) lcs[i] = [];
		for(var i = oldTokens.length - 1; i >= 0; i--) {
			for(var j = newTokens.length - 1; j >= 0; j--) {
				lcs[i][j] = oldTokens[i] === newTokens[j] ? (lcs[i + 1][j + 1] || 0) + 1 : Math.max(lcs[i + 1][j] || 0, lcs[i][j + 1] || 0);
			}
		}
		var ops = [];
		var i = 0;
		var j = 0;
		while(i < oldTokens.length || j < newTokens.length) {
			if(i < oldTokens.length && j < newTokens.length && oldTokens[i] === newTokens[j]) {
				ops.push({t: 'same', text: oldTokens[i]});
				i++;
				j++;
			} else if(j < newTokens.length && (i >= oldTokens.length || (lcs[i][j + 1] || 0) > (lcs[i + 1][j] || 0))) {
				ops.push({t: 'add', text: newTokens[j]});
				j++;
			} else if(i < oldTokens.length) {
				ops.push({t: 'del', text: oldTokens[i]});
				i++;
			}
		}
		var oldSegments = [];
		var newSegments = [];
		var block = null;
		function flushBlock() {
			if(!block) return;
			var pairs = Math.min(block.del.length, block.add.length);
			for(var k = 0; k < pairs; k++) {
				if(refinable(block.del[k]) && refinable(block.add[k])) {
					var segs = charSegments(block.del[k], block.add[k]);
					for(var a = 0; a < segs.old.length; a++) oldSegments.push(segs.old[a]);
					for(var b = 0; b < segs.new.length; b++) newSegments.push(segs.new[b]);
				} else {
					oldSegments.push([block.del[k], true]);
					newSegments.push([block.add[k], true]);
				}
			}
			for(var m = pairs; m < block.del.length; m++) oldSegments.push([block.del[m], true]);
			for(var n = pairs; n < block.add.length; n++) newSegments.push([block.add[n], true]);
			block = null;
		}
		for(var k = 0; k < ops.length; k++) {
			if(ops[k].t === 'same') {
				flushBlock();
				oldSegments.push([ops[k].text, false]);
				newSegments.push([ops[k].text, false]);
			} else {
				if(!block) block = {del: [], add: []};
				(ops[k].t === 'del' ? block.del : block.add).push(ops[k].text);
			}
		}
		flushBlock();
		return {old: oldSegments, new: newSegments};
	}
	function renderSegments(segments, cls) {
		var html = '';
		for(var i = 0; i < segments.length; i++) {
			html += segments[i][1] ? '<span class="' + cls + '">' + escapeHtml(segments[i][0]) + '</span>' : escapeHtml(segments[i][0]);
		}
		return html;
	}
	function diffLines(oldLines, newLines) {
		var lcs = [];
		for(var i = 0; i <= oldLines.length; i++) lcs[i] = [];
		for(var i = oldLines.length - 1; i >= 0; i--) {
			for(var j = newLines.length - 1; j >= 0; j--) {
				lcs[i][j] = oldLines[i] === newLines[j] ? (lcs[i + 1][j + 1] || 0) + 1 : Math.max(lcs[i + 1][j] || 0, lcs[i][j + 1] || 0);
			}
		}
		var ops = [];
		var i = 0;
		var j = 0;
		while(i < oldLines.length || j < newLines.length) {
			if(i < oldLines.length && j < newLines.length && oldLines[i] === newLines[j]) {
				ops.push({t: 'same', text: oldLines[i]});
				i++;
				j++;
			} else if(i < oldLines.length && j < newLines.length && oldLines[i + 1] === newLines[j]) {
				ops.push({t: 'removed', text: oldLines[i]});
				i++;
			} else if(i < oldLines.length && j < newLines.length && oldLines[i] === newLines[j + 1]) {
				ops.push({t: 'added', text: newLines[j]});
				j++;
			} else if(j < newLines.length && (i === oldLines.length || (lcs[i][j + 1] || 0) > (lcs[i + 1][j] || 0))) {
				ops.push({t: 'added', text: newLines[j]});
				j++;
			} else if(i < oldLines.length) {
				ops.push({t: 'removed', text: oldLines[i]});
				i++;
			}
		}
		var html = [];
		var block = null;
		function flushBlock() {
			if(!block) return;
			if(block.removed.length && block.added.length) {
				var pairs = Math.min(block.removed.length, block.added.length);
				for(var k = 0; k < pairs; k++) {
					var segments = diffSegments(block.removed[k], block.added[k]);
					html.push('<div class="removed">' + renderSegments(segments.old, 'removed-inline') + '</div>');
					html.push('<div class="added">' + renderSegments(segments.new, 'added-inline') + '</div>');
				}
				for(var m = pairs; m < block.removed.length; m++) {
					html.push('<div class="removed">' + escapeHtml(block.removed[m] || ' ') + '</div>');
				}
				for(var n = pairs; n < block.added.length; n++) {
					html.push('<div class="added">' + escapeHtml(block.added[n] || ' ') + '</div>');
				}
			} else {
				for(var p = 0; p < block.removed.length; p++) {
					html.push('<div class="removed">' + escapeHtml(block.removed[p] || ' ') + '</div>');
				}
				for(var q = 0; q < block.added.length; q++) {
					html.push('<div class="added">' + escapeHtml(block.added[q] || ' ') + '</div>');
				}
			}
			block = null;
		}
		for(var k = 0; k < ops.length; k++) {
			if(ops[k].t === 'same') {
				flushBlock();
				html.push('<div class="same">' + escapeHtml(ops[k].text || ' ') + '</div>');
			} else {
				if(!block) block = {removed: [], added: []};
				(ops[k].t === 'removed' ? block.removed : block.added).push(ops[k].text);
			}
		}
		flushBlock();
		return html;
	}
	window.renderRevisionDiff = function(index) {
		index = parseInt(index, 10) || 0;
		var selected = revisions[index] || revisions[0];
		var newer = revisions[index - 1] || selected;
		var oldLines = textOf(selected).split('\n');
		var newLines = textOf(newer).split('\n');
		var html = diffLines(oldLines, newLines);
		var diff = document.getElementById('revision_diff');
		var restore = document.getElementById('revision_restore');
		var editid = document.getElementById('revision_editid');
		if(diff) diff.innerHTML = html.join('') || '<div class="same">&nbsp;</div>';
		if(restore) restore.disabled = !selected.id;
		if(editid) editid.value = selected.id || 0;
	};
	setTimeout(function() {
		var select = document.getElementById('revision_select');
		if(select && revisions.length) {
			select.value = revisions.length > 1 ? '1' : '0';
			renderRevisionDiff(select.value);
		} else if(revisions.length) {
			renderRevisionDiff(0);
		}
		var win = document.getElementById('fwin_editlog');
		if(win) {
			var vw = document.documentElement.clientWidth;
			var vh = document.documentElement.clientHeight;
			win.style.left = Math.max(0, (vw - win.offsetWidth) / 2) + 'px';
			win.style.top = Math.max(0, (vh - win.offsetHeight) / 2) + 'px';
		}
	}, 20);
})();
</script>
