<!--{template common/header}-->
<!--{if $op != ''}-->
	<div class="threadlist_box mt10 cl">
		<div class="threadlist cl">
			<ul>
				<h4>{lang user_mobile_pm_error}</h4>
			</ul>
		</div>
	</div>
<!--{else}-->
<form id="pmform_{$pmid}" name="pmform_{$pmid}" method="post" autocomplete="off" action="home.php?mod=spacecp&ac=pm&op=send&touid=$touid&pmid=$pmid" >
	<input type="hidden" name="referer" value="{echo dreferer();}" />
	<input type="hidden" name="pmsubmit" value="true" />
	<input type="hidden" name="formhash" value="{FORMHASH}" />
	<div class="header cl">
	<div class="mz"><a href="home.php?mod=space&do=pm"><i class="dm-c-left"></i></a></div>
		<h2>{lang send_pm}</h2>		
	</div>
	<div class="post_box">
		<ul>
			<!--{if !$touid}-->
			<li class="mli"><input type="text" value="" class="px" autocomplete="off" id="username" name="username" placeholder="{lang addressee}"></li>
			<!--{/if}-->
			<li class="mtext">
				<textarea class="pt" autocomplete="off" value="" id="sendmessage" name="message" placeholder="{lang thread_content}"></textarea>
			</li>
		</ul>
	</div>	
	<div class="post_btn"><button id="pmsubmit_btn" class="pn btn_pn mgrey" disable="true">{lang sendpm}</button></div>
</form>
<script>
	(function() {
		var message = document.getElementById('sendmessage');
		var form = document.getElementById('pmform_{$pmid}');
		var button = document.getElementById('pmsubmit_btn');
		message.addEventListener('input', function() {
			if(message.value) {
				document.querySelectorAll('.btn_pn').forEach(function(element) {
					element.classList.remove('mgrey');
					element.classList.add('mblue');
					element.setAttribute('disable', 'false');
				});
			} else {
				document.querySelectorAll('.btn_pn').forEach(function(element) {
					element.classList.remove('mblue');
					element.classList.add('mgrey');
					element.setAttribute('disable', 'true');
				});
			}
		});
		button.addEventListener('click', function(event) {
			event.preventDefault();
			if(button.getAttribute('disable') == 'true') {
				return false;
			}
			mobileRequest({
				method:'POST',
				url:form.action + '&handlekey='+form.id+'&inajax=1',
				data:new FormData(form),
				dataType:'html'
			}).then(function(s) {
				popup.open(s);
			}).catch(function() {
				popup.open('{lang networkerror}', 'alert');
			});
			return false;
			});
	 })();
</script>
<!--{/if}-->
<!--{template common/footer}-->
