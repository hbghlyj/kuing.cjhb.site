<script type="text/javascript" reload="1">
<!--{if !$type}-->
	var mpimgmax = 12;
	var multipicInput = document.getElementById('multipic_sel');

	if (typeof FileReader !== 'undefined' && typeof DataTransfer !== 'undefined') {
		multipicInput.addEventListener('change', function() {
			if (this.files.length > mpimgmax) {
				var selectedFiles = new DataTransfer();
				Array.from(this.files).slice(0, mpimgmax).forEach(function(file) {
					selectedFiles.items.add(file);
				});
				this.files = selectedFiles.files;
			}
			renderMultiPicPreviews();
		});
	}

	function renderMultiPicPreviews() {
		document.querySelectorAll('#multipic_img .previewbigpic').forEach(function(preview) {
			preview.remove();
		});
		Array.from(multipicInput.files).forEach(function(file, index) {
			var reader = new FileReader();
			reader.onload = function(event) {
				var img = new Image();
				img.src = event.target.result;
				img.style.width = '100%';
				img.style.height = '100%';
				img.style.objectFit = 'cover';

				var imgWrapper = document.createElement('div');
				imgWrapper.className = 'previewbigpic z';
				var removeButton = document.createElement('i');
				removeButton.className = 'fico-error';
				removeButton.onclick = function() {
					MultiPicDel(index);
				};
				imgWrapper.append(removeButton, img);
				document.getElementById('multipic_img').prepend(imgWrapper);
			};
			reader.readAsDataURL(file);
		});
		document.querySelector('.image-upload-mp').style.display = multipicInput.files.length >= mpimgmax ? 'none' : '';
	}

	function MultiPicDel(index) {
		var remainingFiles = new DataTransfer();
		Array.from(multipicInput.files).forEach(function(file, fileIndex) {
			if (fileIndex !== index) {
				remainingFiles.items.add(file);
			}
		});
		multipicInput.files = remainingFiles.files;
		renderMultiPicPreviews();
	}
<!--{/if}-->
</script>
