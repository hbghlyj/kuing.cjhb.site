<!--{template common/header}-->
<div class="header cl"><div class="mz"><a href="javascript:history.back();"><i class="dm-c-left"></i></a></div><h2>{lang post_revision_history}</h2><div class="my"><a href="index.php"><i class="dm-house"></i></a></div></div>
<div class="thread-editlog-list mathjax_ignore">
	<!--{if $editlogs}-->
	<!--{loop $editlogs $editlog}-->
		<div class="thread-editlog-item">
			<!--{if $editlog[pid]}--><a class="thread-editlog-subject" href="forum.php?mod=redirect&goto=findpost&ptid=$editlog[tid]&pid=$editlog[pid]"><b>$editlog[title]</b></a><!--{else}--><b class="thread-editlog-subject">$editlog[title]</b><!--{/if}-->
			<div class="thread-editlog-meta"><strong>$editlog[action_label]</strong><span class="xg1">$editlog[displaytime]</span></div>
			<div class="thread-editlog-previous"><strong>{lang post_revision_content}:</strong><em>$editlog[old_message]</em></div>
			<a class="dialog thread-editlog-compare" href="forum.php?mod=misc&action=editlog&tid=$editlog[tid]&pid=$editlog[pid]">{lang post_revision_compare}</a>
		</div>
	<!--{/loop}-->
	<!--{else}--><p class="emp">{lang post_revision_empty}</p><!--{/if}-->
	<!--{if $multi}--><div class="pgs cl mtm">$multi</div><!--{/if}-->
</div>
<style>.thread-editlog-list{padding:10px}.thread-editlog-item{display:block;padding:12px 10px;margin-bottom:8px;background:#fff;border-radius:4px}.thread-editlog-item strong,.thread-editlog-item span{margin-right:8px}.thread-editlog-subject{display:block;font-weight:700}.thread-editlog-subject:hover{color:var(--dz-BG-color)}.thread-editlog-meta{margin-top:4px}.thread-editlog-previous{margin-top:6px}.thread-editlog-previous em{display:block;margin-top:4px;color:#888;font-style:normal;white-space:pre-wrap;overflow-wrap:anywhere}.thread-editlog-compare{display:inline-block;margin-top:6px;color:var(--dz-BG-color)}</style>
