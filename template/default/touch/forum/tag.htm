<!--{template common/header}-->
<!--{if ($op == 'set')}-->
<!--{elseif ($op == 'manage')}-->
<div class="tip loginbox loginpop p5" id="floatlayout_topicadmin">
<h2 class="tit" id="return_tag">{lang post_tag}</h2>
<!--{template forum/tag_input}-->
<input type="hidden" name="tid" id="tid" value="$_GET['tid']" />
<div class="mb10 cl"></div>
<dd>
<button type="button" name="search_button" class="pn button z" value="false" onclick="tagset();"><strong>{lang submit}</strong></button>
<button type="button" id="closebtn" class="pn button btn_pn_red y" onclick="popup.close();"><strong>{lang close}</strong></button>
</dd>
</div>
<!--{/if}-->
<script>
function tagset() {
	var tagsEl = $('tags') || getID('tags');
	var tags = tagsEl ? tagsEl.value : '';
	var tid = getID('tid').value;
	tags = BROWSER.ie && document.charset == 'utf-8' ? encodeURIComponent(tags) : tags;
	var url = 'forum.php?mod=misc&action=retag&inajax=1&tags='+encodeURIComponent(tags)+'&tid='+tid+'&formhash={FORMHASH}';
	var x = new Ajax();
	x.getJSON(url, function(s){
		if(s && s.status == 'success') {
			updateThreadTags(s.tags);
			popup.close();
		}
	});
}

function updateThreadTags(tags) {
	var el = getID('threadtags');
	if(!el) {
		return;
	}
	el.innerHTML = '';
	if(tags && tags.length) {
		for(var i = 0; i < tags.length; i++) {
			if(i) {
				el.appendChild(document.createTextNode(', '));
			}
			var link = document.createElement('a');
			link.title = tags[i].name;
			link.href = 'misc.php?mod=tag&id=' + encodeURIComponent(tags[i].id) + '&name=' + encodeURIComponent(tags[i].name);
			link.target = '_blank';
			link.textContent = tags[i].name;
			el.appendChild(link);
		}
	}
}
</script>
<!--{template common/footer}-->
