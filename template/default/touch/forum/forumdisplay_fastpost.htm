<div id="post_new"></div>
<div class="plc cl">
	<form method="post" autocomplete="off" id="fastpostform" action="forum.php?mod=post&action=reply&fid=$_G['fid']&tid=$_G['tid']&extra=$_GET['extra']&replysubmit=yes">
	<input type="hidden" name="formhash" value="{FORMHASH}" />
	<span class="avatar"><!--{echo avatar($_G['uid'], 'small', ['username' => $_G['username'], 'avatarstatus' => $_G['member']['avatarstatus']])}--></span>
	<div class="pi">
		<ul class="fastpost">
		<!--{if $_G['forum_thread']['special'] == 5 && empty($firststand)}-->
		<li>
		<select id="stand" name="stand" >
			<option value="">{lang debate_viewpoint}</option>
			<option value="0">{lang debate_neutral}</option>
			<option value="1">{lang debate_square}</option>
			<option value="2">{lang debate_opponent}</option>
		</select>
		</li>
		<!--{/if}-->
		<li><input type="text" value="{lang send_reply_fast_tip}" class="input grey" color="gray" name="message" id="fastpostmessage"></li>
		<li id="fastpostsubmitline" style="display:none;"><!--{if $secqaacheck || $seccodecheck}--><!--{subtemplate common/seccheck}--><!--{/if}--><input type="button" value="{lang reply}" class="button2" name="replysubmit" id="fastpostsubmit"><a href="forum.php?mod=post&action=reply&fid=$_G['fid']&tid=$_G['tid']&reppost=$_G['forum_firstpid']&page=$page" class="y" style="height:30px;width:30px;margin-top:7px;background:url({STATICURL}image/mobile/images/icon_photo.png) no-repeat"><span class="none">{lang reply}</span></a><!--{hook/viewthread_fastpost_button_mobile}--></li>
		</ul>
	</div>
    </form>
</div>
<script type="text/javascript">
	(function() {
		var form = document.getElementById('fastpostform');
		<!--{if !$_G['uid'] || $_G['uid'] && !$allowpostreply}-->
		document.getElementById('fastpostmessage').addEventListener('focus', function() {
			<!--{if !$_G['uid']}-->
				popup.open('{lang nologin_tip}', 'confirm', 'member.php?mod=logging&action=login');
			<!--{else}-->
				popup.open('{lang nopostreply}', 'alert');
			<!--{/if}-->
			this.blur();
		});
		<!--{else}-->
		document.getElementById('fastpostmessage').addEventListener('focus', function() {
			if(this.getAttribute('color') == 'gray') {
				this.value = '';
				this.classList.remove('grey');
				this.setAttribute('color', 'black');
				document.getElementById('fastpostsubmitline').style.display = 'block';
			}
		});
		document.getElementById('fastpostmessage').addEventListener('blur', function() {
			if(this.value == '') {
				this.classList.add('grey');
				this.value = '{lang send_reply_fast_tip}';
				this.setAttribute('color', 'gray');
			}
		});
		<!--{/if}-->
		document.getElementById('fastpostsubmit').addEventListener('click', function() {
			var msgobj = document.getElementById('fastpostmessage');
			if(msgobj.value == '{lang send_reply_fast_tip}') {
				msgobj.value = '';
			}
			mobileRequest({
				method:'POST',
				url:form.action + '&handlekey=fastpost&loc=1&inajax=1',
				data:(function() { var data = new FormData(form); if(window.KK_PUSHER_SOCKET_ID) data.set('pusher_socket_id', window.KK_PUSHER_SOCKET_ID); return data; })(),
				dataType:'html'
			}).then(function(s) {
				evalscript(s);
			}).catch(function() {
				window.location.href = form.action;
				popup.close();
			});
			return false;
		});

		document.getElementById('replyid')?.addEventListener('click', function() {
			window.scrollTo({top: document.documentElement.scrollHeight, behavior: 'smooth'});
			document.getElementById('fastpostmessage').focus();
		});

	})();

	function succeedhandle_fastpost(locationhref, message, param) {
		var pid = param['pid'];
		var tid = param['tid'];
		var reply_mod = param['reply_mod'];
		if(!reply_mod) {
			mobileRequest({
				method:'POST',
				url:'forum.php?mod=viewthread&tid=' + tid + '&viewpid=' + pid,
				dataType:'html'
			}).then(function(s) {
				document.getElementById('post_new').insertAdjacentHTML('beforeend', s);
			}).catch(function() {
				window.location.href = 'forum.php?mod=viewthread&tid=' + tid;
				popup.close();
			});
		} else {
			if(!message) {
				message = '{lang postreplyneedmod}';
			}
			popup.open(message, 'alert');
		}
		document.getElementById('fastpostmessage').value = '';
		if(param['sechash']) {
			document.querySelector('.seccodeimg')?.click();
		}
	}

	function errorhandle_fastpost(message, param) {
		popup.open(message, 'alert');
	}
</script>
