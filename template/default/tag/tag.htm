<!--{template common/header}-->
<!--{if $type != 'countitem'}-->
<div id="pt" class="bm cl">
	<div class="z">
		<a href="./" class="nvhm" title="{lang homepage}"></a> <em>&rsaquo;</em>
		{lang tag}
	</div>
</div>
<div id="ct" class="wp cl">
	<h1 class="mt"><i class="fico-tag fc-s" alt="tag"></i> {lang tag}</h1>
	<div class="bm">
		<div class="bm_c">
			<!--{eval $taginputname = 'name'; $tags = '';}-->
			<form method="get" action="misc.php" class="pns">
				<input type="hidden" name="mod" value="tag" />
				<label for="keyword-input">{lang tag}:</label>
				<!--{subtemplate forum/tag_input}-->
				<button type="submit" class="pn"><em>{lang search}</em></button>
				<div class="tbmu">
					<a href="misc.php?mod=tag" $orderactives[time]>{lang sortby_time_desc}</a><span class="pipe">|</span>
					<a href="misc.php?mod=tag&sortby=related_count" $orderactives[related_count]>{lang sortby_related_count_desc}</a><span class="pipe">|</span>
					<a href="misc.php?mod=tag&sortby=hot" $orderactives[hot]>{lang sortby_hot_desc}</a>
				</div>
			</form>
			<style>input.px:not(:focus)+button.pn:not(:hover) {display: none}</style>
			<div class="taglist mtm mbm">
				<!--{if $tagarray}-->
					<!--{loop $tagarray $tag}-->
						<a href="misc.php?mod=tag&id=$tag[tagid]" title="$tag[tagname]" class="xi2">$tag[tagname]<span class="xg1">{echo $tag[related_count]}</span></a>
					<!--{/loop}-->
				<!--{else}-->
					<p class="emp">{lang no_tag}</p>
				<!--{/if}-->
			</div>
			<!--{if $multipage}--><div class="pgs mtm cl">$multipage</div><!--{/if}-->
		</div>
	</div>
</div>
<!--{else}-->
$num
<!--{/if}-->
<!--{template common/footer}-->
