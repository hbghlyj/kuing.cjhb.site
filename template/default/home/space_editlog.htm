<!--{template common/header}-->
<div id="pt" class="bm cl"><div class="z"><a href="./" class="nvhm" title="{lang homepage}"></a><em>&rsaquo;</em><a href="home.php?mod=space&uid=$space[uid]">$space[username]</a><em>&rsaquo;</em>{lang post_revision_history}</div></div>
<div id="ct" class="ct1 wp cl"><div class="mn">
	<div class="bm">
		<div class="bm_h"><h1>{lang post_revision_history}</h1></div>
		<div class="bm_c mathjax_ignore">
			<!--{if $editlogs}-->
				<ul class="editlog-list">
				<!--{loop $editlogs $editlog}-->
					<li class="editlog-item">
						<!--{if $editlog[pid]}--><a href="forum.php?mod=redirect&goto=findpost&ptid=$editlog[tid]&pid=$editlog[pid]" target="_blank" class="editlog-subject">$editlog[title]</a><!--{else}--><span class="editlog-subject">$editlog[title]</span><!--{/if}-->
						<div class="editlog-meta"><strong>$editlog[action_label]</strong> <span class="xg1">$editlog[displaytime]</span></div>
						<div class="editlog-previous"><strong>{lang post_revision_content}:</strong><div class="xg1">$editlog[old_message]</div></div>
						<a href="forum.php?mod=misc&action=editlog&tid=$editlog[tid]&pid=$editlog[pid]" onclick="showWindow('editlog', this.href, 'get', 0);return false;" class="editlog-link">{lang post_revision_compare}</a>
					</li>
				<!--{/loop}-->
				</ul>
			<!--{else}--><p class="emp">{lang post_revision_empty}</p><!--{/if}-->
			<!--{if $multi}--><div class="pgs cl mtm">$multi</div><!--{/if}-->
		</div>
	</div>
</div></div>
<style>.editlog-list{margin:0;padding:0;list-style:none}.editlog-item{padding:10px 0;border-bottom:1px solid #eee}.editlog-subject{display:block;font-weight:700}.editlog-subject:hover{color:var(--dz-color)}.editlog-meta{margin-top:4px}.editlog-previous{margin-top:6px}.editlog-previous>div{margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}.editlog-link{display:inline-block;margin-top:6px;color:var(--dz-color)}</style>
<!--{template common/footer}-->
