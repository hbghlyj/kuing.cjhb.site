name: PHP Syntax Lint

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache lint harness dependencies
        uses: actions/cache@v4
        with:
          path: .agents/tools/php-lint/node_modules
          key: ${{ runner.os }}-php-lint-${{ hashFiles('.agents/tools/php-lint/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-php-lint-

      - name: Install lint harness
        working-directory: .agents/tools/php-lint
        run: npm ci

      - name: Verify the harness detects broken PHP
        run: node .agents/tools/php-lint/lint.mjs --self-test

      - name: Lint every tracked PHP file
        run: node .agents/tools/php-lint/lint.mjs
