<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MathJax blacksquare font diagnostic</title>
<style>
  body { margin: 2rem; font: 16px/1.5 system-ui, sans-serif; }
  .cases { display: grid; grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr)); gap: 1rem; }
  iframe { width: 100%; height: 13rem; border: 1px solid #aaa; border-radius: .4rem; }
</style>
<h1>MathJax <code>\blacksquare</code> font diagnostic</h1>
<p>Each frame reports the computed style of the rendered operator. The Pagella frame matches the forum output configuration.</p>
<div class="cases" id="cases"></div>
<script>
  const cases = [
    ['Forum Pagella', 'mathjax-pagella'],
    ['New Computer Modern', 'mathjax-newcm'],
    ['Pagella inside italic HTML', 'mathjax-pagella', '<i>\\(\\blacksquare\\)</i>'],
    ['Pagella text square', 'mathjax-pagella', '\\(\\mathord{\\text{■}}\\)'],
    ['Pagella macro replacement', 'mathjax-pagella', '\\(\\blacksquare\\)', {
      blacksquare: '\\mathord{\\text{■}}'
    }],
    ['Screenshot input: \\V\\blacksquare', 'mathjax-pagella', '\\(\\V\\blacksquare\\)'],
  ];

  const frame = (label, font, math = '\\(\\blacksquare\\)', macros = {}) => `<!doctype html><meta charset="utf-8">
    <style>body{font:18px/1.5 system-ui,sans-serif;margin:1rem}mjx-container{font-size:220%}pre{font:12px/1.35 ui-monospace,monospace;white-space:pre-wrap}</style>
    <h2>${label}</h2><div id="math">${math}</div><pre id="result">Loading MathJax...</pre>
    <script>
      window.MathJax = {
        loader: { load: ['[tex]/noerrors'] },
        tex: { inlineMath: [['\\\\(', '\\\\)']], packages: {'[+]': ['noerrors']}, macros: ${JSON.stringify(macros)} },
        chtml: { matchFontHeight: true },
        output: { font: '${font}', fontPath: 'https://unpkg.com/@mathjax/%%FONT%%-font' },
        startup: { ready() {
          MathJax.startup.defaultReady();
          MathJax.startup.promise.then(() => {
            const math = document.querySelector('mjx-container');
            const glyph = math && [...math.querySelectorAll('mjx-mo,mjx-mi,mjx-mtext')].find(node => node.textContent.trim());
            const style = glyph && getComputedStyle(glyph);
            document.querySelector('#result').textContent = JSON.stringify({
              text: glyph && glyph.textContent,
              tag: glyph && glyph.tagName,
              className: glyph && glyph.className,
              fontFamily: style && style.fontFamily,
              fontStyle: style && style.fontStyle,
              fontWeight: style && style.fontWeight
            }, null, 2);
          });
        } }
      };
    <\/script><script async src="https://unpkg.com/mathjax@4/tex-chtml-nofont.js"><\/script>`;

  for(const [label, font, math, macros] of cases) {
    const iframe = document.createElement('iframe');
    iframe.title = label;
    iframe.srcdoc = frame(label, font, math, macros);
    document.querySelector('#cases').append(iframe);
  }
</script>
