<svg viewBox="0 0 2400 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2d82e3"/>
      <stop offset="50%"  stop-color="#5ca0ee"/>
      <stop offset="85%"  stop-color="#90c8f8"/>
      <stop offset="96%"  stop-color="#bce4fb"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Cloud Volume Shading (Sun overhead-left, ambient sky reflection below) -->
    <linearGradient id="cloudVolumeGrad" x1="0.2" y1="0" x2="0.1" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="40%"  stop-color="#f5f8fd"/>
      <stop offset="72%"  stop-color="#d4e2f4"/>
      <stop offset="92%"  stop-color="#adc4e2"/>
      <stop offset="100%" stop-color="#9bb3d3"/>
    </linearGradient>

    <!-- Edge Softening / Base Blend Mask -->
    <linearGradient id="cloudBaseFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="68%"  stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="88%"  stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="96%"  stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <mask id="smoothBaseMask">
      <rect width="2400" height="600" fill="url(#cloudBaseFade)"/>
    </mask>

    <!-- Organic Mass Filter: Blurs primitives into a unified blob first, then displaces billows -->
    <filter id="cohesiveBillows" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <!-- Unify component shapes so internal disc seams disappear -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="cohesiveShape"/>
      <!-- Generate multi-scale turbulence -->
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="5" seed="44" result="fineNoise"/>
      <feDisplacementMap in="cohesiveShape" in2="fineNoise" scale="36" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feGaussianBlur in="displaced" stdDeviation="1.2"/>
    </filter>

    <!-- Soft Base Filter for Ambient Air Blending -->
    <filter id="softUnderbelly" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="12" result="noise"/>
      <feDisplacementMap in="blur" in2="noise" scale="32" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Distant Cloud Filter (Tighter billows, softer edge) -->
    <filter id="distantBillows" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="base"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="4" seed="29" result="noise"/>
      <feDisplacementMap in="base" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1"/>
    </filter>

    <!-- Unified Cloud 1 Silhouette (Foreground Left) -->
    <path id="cloud-1-path" d="
      M 190,370
      C 150,370 120,340 145,300
      C 130,270 160,230 200,225
      C 220,180 270,140 330,140
      C 370,140 405,160 425,185
      C 460,175 510,195 525,235
      C 570,250 595,295 570,340
      C 580,365 555,385 520,380
      C 460,390 400,385 340,385
      C 280,385 230,385 190,370 Z
    "/>

    <!-- Unified Cloud 2 Silhouette (Foreground Right) -->
    <path id="cloud-2-path" d="
      M 740,370
      C 700,360 680,325 705,290
      C 695,255 725,220 765,210
      C 790,165 845,140 900,150
      C 945,150 985,180 1005,210
      C 1045,215 1080,245 1075,290
      C 1105,325 1085,365 1045,375
      C 980,380 910,380 850,380
      C 800,380 765,380 740,370 Z
    "/>

    <!-- Distant Left Silhouette -->
    <path id="cloud-3-path" d="
      M 30,470
      C 5,460 5,430 25,410
      C 20,385 45,360 75,360
      C 95,335 130,335 150,355
      C 175,360 195,385 185,415
      C 200,440 185,470 155,470 Z
    "/>

    <!-- Distant Low Silhouette -->
    <path id="cloud-4-path" d="
      M 530,510
      C 505,505 500,480 520,465
      C 520,445 545,430 565,435
      C 580,415 615,415 630,430
      C 655,435 670,455 660,480
      C 670,500 655,515 635,515 Z
    "/>
  </defs>

  <!-- Sky Base -->
  <rect width="2400" height="600" fill="url(#skyGrad)"/>

  <!-- Left Side: Distant Cloud (moved further up and detached from main cloud) -->
  <g mask="url(#smoothBaseMask)" opacity="0.9" transform="translate(-70, -180)">
    <use href="#cloud-3-path" fill="#88aedc" transform="translate(0, 8)" filter="url(#softUnderbelly)" opacity="0.6"/>
    <use href="#cloud-3-path" fill="url(#cloudVolumeGrad)" filter="url(#distantBillows)"/>
    <use href="#cloud-3-path" fill="#ffffff" filter="url(#distantBillows)" opacity="0.4" transform="scale(0.96) translate(5, 5)"/>
  </g>

  <!-- Left Side: Main Cloud -->
  <g mask="url(#smoothBaseMask)" transform="translate(60, 0)">
    <use href="#cloud-1-path" fill="#82a9db" transform="translate(4, 18)" filter="url(#softUnderbelly)" opacity="0.75"/>
    <use href="#cloud-1-path" fill="url(#cloudVolumeGrad)" filter="url(#cohesiveBillows)"/>
    <path d="M 230,235 C 270,160 360,150 410,175 C 455,195 490,225 470,270 C 420,275 350,240 280,260 Z" 
          fill="#ffffff" filter="url(#cohesiveBillows)" opacity="0.9"/>
  </g>

  <!-- Right Side: Distant Cloud (moved further up and detached from main cloud) -->
  <g mask="url(#smoothBaseMask)" opacity="0.85" transform="translate(1130, -230)">
    <use href="#cloud-4-path" fill="#8cb2df" transform="translate(0, 6)" filter="url(#softUnderbelly)" opacity="0.55"/>
    <use href="#cloud-4-path" fill="url(#cloudVolumeGrad)" filter="url(#distantBillows)"/>
    <use href="#cloud-4-path" fill="#ffffff" filter="url(#distantBillows)" opacity="0.35" transform="scale(0.96) translate(18, 12)"/>
  </g>

  <!-- Right Side: Main Cloud -->
  <g mask="url(#smoothBaseMask)" transform="translate(1200, 0)">
    <!-- Sub-base atmospheric shadow -->
    <use href="#cloud-2-path" fill="#7fa6d8" transform="translate(2, 16)" filter="url(#softUnderbelly)" opacity="0.7"/>
    <!-- Core Volume Body -->
    <use href="#cloud-2-path" fill="url(#cloudVolumeGrad)" filter="url(#cohesiveBillows)"/>
    <!-- Inner Volumetric Highlight -->
    <path d="M 770,220 C 820,165 890,165 935,175 C 980,185 1015,225 995,255 C 950,265 880,240 825,250 Z" 
          fill="#ffffff" filter="url(#cohesiveBillows)" opacity="0.85"/>
  </g>
</svg>
